<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Redirect to handle client-side routing on GitHub Pages
      sessionStorage.redirect = location.href;
      location.replace(
        location.origin + location.pathname.split('/').slice(0, 2).join('/') + '/#' + location.pathname.slice(location.pathname.split('/').slice(0, 2).join('/').length) + location.search
      );
    </script>
  </head>
  <body></body>
</html>
